<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大V发言整合看板</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#1f2329; --muted:#8a93a0;
    --border:#e8eaed; --bar:#d7dbe0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);font-size:14px;}
  header{position:sticky;top:54px;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--border);padding:12px 18px;}
  .title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;}
  .title .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18);}
  .sub{color:var(--muted);font-size:12px;margin-top:4px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
        border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;user-select:none;
        transition:.15s;}
  .chip .c-dot{width:8px;height:8px;border-radius:50%;}
  .chip.off{opacity:.45;}                       /* 灰 = 此刻不显示，点一下就能回来 */
  .chip.off .c-dot{background:#c3c8d0 !important;}
  .chip .cbox{width:14px;height:14px;flex:none;border:1.5px solid #cfd5dd;border-radius:4px;
              background:#fff;display:inline-flex;align-items:center;justify-content:center;
              font-size:10px;line-height:1;color:#fff;margin-right:-1px;}
  .chip.chk{border-color:#c7d2fe;background:#f8faff;}   /* 蓝框 = 每次打开默认看它 */
  .chip.chk .cbox{background:#3b82f6;border-color:#3b82f6;}
  .chip .cbox{position:relative;}
  .chip .cbox::after{content:"";position:absolute;inset:-7px -6px;}  /* 小方块太难点，热区放大 */
  .chip .nm{white-space:nowrap;}
  .chip .cnt{color:var(--muted);font-variant-numeric:tabular-nums;}
  .pickmini{padding:4px 11px;border:1px solid var(--border);background:#fff;color:var(--muted);
            border-radius:999px;cursor:pointer;font-size:12px;}
  .pickmini:hover{border-color:#3b82f6;color:#3b82f6;background:#f8faff;}
  .pickmini:first-of-type{margin-left:6px;}
  .pickok{padding:4px 16px;border:1px solid #3b82f6;background:#3b82f6;color:#fff;
          border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;}
  .pickok:hover{filter:brightness(1.07);}
  .pickok.done{background:#16a34a;border-color:#16a34a;}
  .ctrls{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .ctrls input[type=text]{flex:1;min-width:180px;padding:7px 11px;border:1px solid var(--border);
        border-radius:8px;font-size:13px;outline:none;}
  .ctrls input[type=text]:focus{border-color:#3b82f6;}
  .btn{padding:7px 13px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;}
  .btn.primary{background:#3b82f6;color:#fff;border-color:#3b82f6;}
  main{padding:16px 18px 60px;max-width:980px;margin:0 auto;}
  .post{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
        margin-bottom:12px;display:flex;gap:12px;position:relative;overflow:hidden;}
  .post .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .post .body{flex:1;min-width:0;}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .tag{color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;}
  .spk{font-weight:700;color:#1f2329;}
  .time{font-variant-numeric:tabular-nums;}
  .txt{white-space:pre-wrap;line-height:1.6;word-break:break-word;}
  .empty{text-align:center;color:var(--muted);padding:60px 0;}
  .err{color:#ef4444;}
  .countdown{font-variant-numeric:tabular-nums;font-weight:600;}
  .post.new{box-shadow:0 0 0 2px #22c55e inset;}
  .badge-new{display:inline-block;background:#22c55e;color:#fff;font-size:10px;
             padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle;}
  .imgs{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;}
  .imgs img{max-width:220px;max-height:220px;border-radius:8px;border:1px solid var(--border);cursor:pointer;}
  .chip.active{background:#eef2ff;border-color:#3b82f6;opacity:1;text-decoration:none;font-weight:600;}
  .tag.clickable,.spk.clickable{cursor:pointer;}
  .tag.clickable:hover,.spk.clickable:hover{filter:brightness(.92);text-decoration:underline;}
  .focusbar{position:sticky;top:0;z-index:5;background:#eef2ff;border:1px solid #c7d2fe;
            color:#1e3a8a;border-radius:10px;padding:8px 12px;margin-bottom:12px;
            display:flex;align-items:center;gap:10px;font-size:13px;}
  .focusbar .x{cursor:pointer;margin-left:auto;background:#3b82f6;color:#fff;border-radius:6px;
              padding:3px 10px;font-size:12px;}
  /* ===== 默认只看选中的选手 ===== */
  .picksum{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;
           color:var(--muted);flex-wrap:wrap;}
  .mini{padding:3px 10px;border:1px solid var(--border);background:#fff;border-radius:7px;
        cursor:pointer;font-size:12px;color:var(--text);}
  .mini:hover{border-color:#3b82f6;color:#3b82f6;}
  .topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
         background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
         padding:10px 18px;}
  .topnav .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  .topnav .tabs{display:flex;gap:6px;margin-left:auto;}
  .topnav .tab{padding:7px 15px;border:1px solid var(--border);background:#fff;color:var(--muted);
         border-radius:8px;cursor:pointer;font-size:13px;transition:.15s;text-decoration:none;}
  .topnav .tab:hover{color:var(--text);}
  .topnav .tab.active{background:#1f2329;color:#fff;border-color:#1f2329;}
  #view-sentiment,#view-lianban{position:fixed;left:0;right:0;top:54px;bottom:0;}
  #view-sentiment iframe,#view-lianban iframe{width:100%;height:100%;border:0;display:block;background:#f5f7fa;}
  #view-lianban iframe{background:#152030;}
</style>
</head>
<body>
<div class="topnav">
  <div class="brand">📊 盘中作战看板</div>
  <div class="tabs">
    <button class="tab active" data-view="feed">大V发言</button>
    <button class="tab" data-view="sentiment">情绪看板</button>
    <button class="tab" data-view="lianban">连板复盘</button>
    <a class="tab" id="newWin" href="/sentiment" target="_blank" rel="noopener">↗ 新窗口</a>
  </div>
</div>
<section id="view-feed">
<header>
  <div class="title"><span class="dot" id="liveDot"></span>大V发言整合看板</div>
  <div class="sub">
    <span>更新于：<b id="updated">--</b></span>
    <span>显示 <b id="total">0</b> 条</span>
    <span>下次刷新 <span class="countdown" id="cd">5</span>s</span>
    <span id="statusLine"></span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="picksum" id="picksum">
    <span id="pickInfo">—</span>
  </div>
  <div class="ctrls">
    <select id="win" class="btn" title="时间范围">
      <option value="1">最近 1 小时</option>
      <option value="6">最近 6 小时</option>
      <option value="24" selected>最近 24 小时</option>
      <option value="0">全部</option>
    </select>
    <input type="text" id="search" placeholder="搜索发言内容 / 发言人…">
    <button class="btn" id="pauseBtn">暂停</button>
    <button class="btn primary" id="refreshBtn">立即刷新</button>
  </div>
</header>
<main id="feed"></main>
</section>
<section id="view-sentiment" style="display:none">
  <iframe src="/sentiment" title="超短线大盘环境实时仪表盘" allow="fullscreen"></iframe>
</section>
<section id="view-lianban" style="display:none">
  <iframe src="/lianban" title="连板复盘" allow="fullscreen"></iframe>
</section>

<script>
const REFRESH_MS = 5000;
const COLORS = {
  "灯神":"#e84393",
  "金牌竞价":"#f39c12",
  "龙头舵主":"#e74c3c",
  "极致短线2":"#1abc9c",
  "极致短线":"#3498db",
  "樱花哥":"#9b59b6",
  "金甲":"#d4a017"
};
let paused = false;
let focus = null;            // 点名字只看某个人：{kind:'source'|'speaker', value:'名字'}
let cdTimer = null;
let cdLeft = REFRESH_MS/1000;
let lastData = null;
let currentHours = 24;
let prevMaxTs = null;        // 上一次拉取的最新时间戳，用于标记新发言

const $ = id => document.getElementById(id);

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// ===== 选手筛选：两套独立状态，别合并 =====
//   ① 当前显示（visible）：点框框里的选手名字 = 开关，可多选，盘中随时切，**不写本地**
//   ② 默认显示（pending）：选手框框外面那个勾选框 + 「确定」，决定「每次打开网页看哪几位」
// 用户 2026-11-19 反复强调：盘中切人是临时动作，绝不能顺手改掉默认设置。
const VIS_KEY = "dingall_visible_sources_v1";
let visible = null;        // Set<源名>：此刻正在显示哪几位
let pending = null;        // Set<源名>：勾选框的状态（= 待保存的默认）
let seenSources = [];      // 上次保存时已知的源名（用于识别后来新增的选手）
let hasSaved = false;      // 本地是否存过默认

function loadVisible(){
  try{
    const raw = localStorage.getItem(VIS_KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(!o || !Array.isArray(o.visible)) return;
    visible = new Set(o.visible);
    pending = new Set(o.visible);
    seenSources = Array.isArray(o.seen) ? o.seen : [];
    hasSaved = true;
  }catch(e){}
}

function ensureVisible(){
  // 首次打开：两套状态都从空开始，让用户自己勾、自己挑
  if(!visible) visible = new Set();
  if(!pending) pending = new Set(visible);
}

// 只保存「默认」，永远不保存「当前显示」——这正是两套状态的意义
function saveVisible(){
  if(!pending) return;
  try{
    localStorage.setItem(VIS_KEY, JSON.stringify({visible:[...pending], seen:seenSources}));
  }catch(e){}
}

function isVisible(name){ return !visible || visible.has(name); }
function isDefault(name){ return !pending || pending.has(name); }

// 新源（不在上次 seen 里）自动并入：默认和当前都要有，别让人以为新源没数据。
// ⚠️ 只在「用户以前存过默认」时做；首次 seenSources 为空会把全部源当新源。
function syncNewSources(sources){
  if(!sources || !sources.length) return false;
  let changed = false;
  if(hasSaved && visible && pending){
    sources.forEach(s=>{
      if(!seenSources.includes(s.name)){
        if(!pending.has(s.name)){ pending.add(s.name); changed = true; }
        if(!visible.has(s.name)){ visible.add(s.name); changed = true; }
      }
    });
  }
  seenSources = sources.map(s=>s.name);
  if(changed) saveVisible();
  return changed;
}

// 【当前显示】点框框里的选手名字：开关这一位，可多选。不碰默认、不写本地。
function toggleSource(name){
  ensureVisible();
  const on = !visible.has(name);
  if(on) visible.add(name); else visible.delete(name);
  // 把正在「只看」的那位藏起来会得到一片空白，顺手退出只看
  if(!on && focus && focus.kind==="source" && focus.value===name) focus = null;
  if(lastData) renderChips(lastData.sources||[]);
  renderPosts();
}

// 【全选 / 全不选】一把梭切换此刻显示哪几位。只动 visible，绝不碰默认（pending）。
// 盘中想快速在「全都看」和「只看一两位」之间来回切，一个个点太磨人。
function setAllVisible(on){
  ensureVisible();
  const srcs = (lastData && lastData.sources) || [];
  visible = on ? new Set(srcs.map(s=>s.name)) : new Set();
  focus = null;                  // 全开/全关之后不该还卡在「只看某人」
  if(lastData) renderChips(srcs);
  renderPosts();
}

// 【默认】点框框外面的勾选框：只改勾选状态，等用户点「确定」才落盘。
function toggleDefault(name, el){
  ensureVisible();
  const on = !pending.has(name);
  if(on) pending.add(name); else pending.delete(name);
  if(el){
    el.classList.toggle("chk", on);
    const b = el.querySelector(".cbox");
    if(b) b.textContent = on ? "✓" : "";
  }
  updPickSum();
}

// 【确定】：把勾选框这套存成默认，同时让当前显示也按它来
function confirmPick(){
  ensureVisible();
  // 一个都没勾就点确定 -> 兜底成全选。宁可全给你看，也别留一片空白。
  if(pending.size === 0){
    const all = ((lastData && lastData.sources) || []).map(s=>s.name);
    if(all.length) pending = new Set(all);
  }
  if(!pending.size) return;
  saveVisible();
  hasSaved = true;
  visible = new Set(pending);        // 确定之后，当前显示也跟着这套走
  if(lastData) renderChips(lastData.sources||[]);
  renderPosts();
  const btn = $("pickOk");
  if(btn){
    btn.classList.add("done");
    btn.textContent = "✓ 已记住";
    setTimeout(()=>{ btn.classList.remove("done"); btn.textContent = "确定"; }, 1400);
  }
}

function updPickSum(){
  const srcs = (lastData && lastData.sources) || [];
  if(!srcs.length) return;
  const shown = srcs.filter(s=>isVisible(s.name)).length;
  const def   = srcs.filter(s=>isDefault(s.name)).length;
  if(!def && !shown){
    $("pickInfo").innerHTML =
      `<span style="color:#f59e0b">先把每次打开想看的选手勾上，点「确定」；平时点选手名字随时开关</span>`;
    return;
  }
  $("pickInfo").innerHTML = (shown === def)
    ? `默认看 <b>${def}</b>/${srcs.length} 位 · 点选手名字可随时开关`
    : `正在看 <b>${shown}</b>/${srcs.length} 位 · 默认 <b>${def}</b> 位`;
}

function renderChips(sources){
  syncNewSources(sources);
  // 窗口内各来源条数（从当前 posts 统计）
  const cnt = {};
  (lastData ? lastData.posts : []).forEach(p=>{ cnt[p.source]=(cnt[p.source]||0)+1; });
  const box = $("chips");
  box.innerHTML = "";
  sources.forEach(s=>{
    const c = COLORS[s.name] || "#888";
    const chk  = isDefault(s.name);     // 勾选框 = 默认
    const shown = isVisible(s.name);    // 灰不灰 = 此刻显示与否
    const active = (focus && focus.kind==="source" && focus.value===s.name) ? " active" : "";
    const dot = s.ok ? c : "#ef4444";
    const n = cnt[s.name] || 0;
    const el = document.createElement("span");
    el.className = "chip" + (chk ? " chk" : "") + (shown ? "" : " off") + active;
    el.innerHTML = `<span class="cbox" title="勾上 = 每次打开网页默认看这几位（改完点右边「确定」）">${chk?"✓":""}</span>`
                 + `<span class="c-dot" style="background:${dot}"></span>`
                 + `<span class="nm" title="点一下切换显示 / 不显示（可多选，不会改默认）">${esc(s.name)}</span>`
                 + `<span class="cnt">${s.ok? n : "×"}</span>`;
    el.onclick = e=>{
      // 点勾选框 = 改默认；点框框里的选手 = 切换此刻显示。两个动作分得很清。
      if(e.target.closest(".cbox")) toggleDefault(s.name, el);
      else toggleSource(s.name);
    };
    box.appendChild(el);
  });
  // 临时层的快捷按钮：只影响此刻显示，跟默认无关
  const allOn = document.createElement("button");
  allOn.className = "pickmini";
  allOn.textContent = "全选";
  allOn.title = "此刻全部显示（不改默认）";
  allOn.onclick = ()=> setAllVisible(true);

  const allOff = document.createElement("button");
  allOff.className = "pickmini";
  allOff.textContent = "全不选";
  allOff.title = "此刻全部不显示（不改默认）";
  allOff.onclick = ()=> setAllVisible(false);

  box.appendChild(allOn);
  box.appendChild(allOff);

  // 选手后面跟一个「确定」：这是「每次打开默认看哪几位」的开关
  const ok = document.createElement("button");
  ok.className = "pickok";
  ok.id = "pickOk";
  ok.textContent = "确定";
  ok.onclick = confirmPick;
  box.appendChild(ok);
  updPickSum();
}

// 把字符串安全地放进 onclick 的单引号 JS 字符串里
function jsArg(s){ return (s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

function setFocus(kind, value){
  focus = {kind, value};
  if(lastData) renderChips(lastData.sources||[]);
  renderPosts();
}
function clearFocus(){
  focus = null;
  if(lastData) renderChips(lastData.sources||[]);
  renderPosts();
}

function renderPosts(){
  const q = $("search").value.trim().toLowerCase();
  const feed = $("feed");
  if(!lastData){ feed.innerHTML = `<div class="empty">加载中…</div>`; return; }
  // 先按「当前显示」筛（色标开关），再叠加「只看某人」（点帖内标签/人名才有）
  let posts = lastData.posts.filter(p=>isVisible(p.source));
  if(focus){
    if(focus.kind==="source") posts = posts.filter(p=>p.source===focus.value);
    else posts = posts.filter(p=>(p.speaker||"")===focus.value);
  }
  const filtered = q
    ? posts.filter(p=>(p.text+" "+(p.speaker||"")).toLowerCase().includes(q))
    : posts;
  // 顶部「只看某人」提示条
  let bar = "";
  if(focus){
    const label = focus.kind==="source" ? ("选手「"+focus.value+"」") : ("发言人「"+focus.value+"」");
    bar = `<div class="focusbar">🔍 正在只看：${esc(label)}（共 ${filtered.length} 条）`
        + `<span class="x" onclick="clearFocus()">✕ 显示全部</span></div>`;
  }
  if(!filtered.length){
    const none = visible && visible.size === 0;
    const msg = none ? "一位选手都没显示 —— 点上方选手名字就能打开"
                     : (q ? "无匹配发言" : "当前窗口内没有发言");
    feed.innerHTML = bar + `<div class="empty">${msg}</div>`;
    $("total").textContent = "0";
    return;
  }
  $("total").textContent = filtered.length;
  feed.innerHTML = bar + filtered.map(p=>{
    const c = COLORS[p.source] || "#888";
    const spk = p.speaker
      ? `<span class="spk clickable" title="点击只看「${esc(p.speaker)}」一个人" `
        + `onclick="setFocus('speaker','${jsArg(p.speaker)}')">${esc(p.speaker)}</span>`
      : "";
    const isNew = (prevMaxTs !== null && p.ts > prevMaxTs);
    const badge = isNew ? `<span class="badge-new">新</span>` : "";
    let imgs = "";
    if(p.images && p.images.length){
      imgs = `<div class="imgs">` + p.images.map(u=>`<img src="${esc(u)}" loading="lazy" onclick="window.open('${esc(u)}')">`).join("") + `</div>`;
    }
    return `<div class="post${isNew?" new":""}">
      <div class="stripe" style="background:${c}"></div>
      <div class="body">
        <div class="meta">
          <span class="tag clickable" style="background:${c}" title="点击只看「${esc(p.source)}」一个人" `
        + `onclick="setFocus('source','${jsArg(p.source)}')">${esc(p.source)}</span>
          ${spk}
          <span class="time">${esc(p.time)}</span>${badge}
        </div>
        <div class="txt">${esc(p.text)}</div>
        ${imgs}
      </div>
    </div>`;
  }).join("");
}

function tick(){
  $("cd").textContent = cdLeft;
  cdLeft--;
  if(cdLeft < 0) cdLeft = REFRESH_MS/1000;
}

function updStatus(sources){
  const bad = (sources||[]).filter(s=>!s.ok);
  // 白名单源认不出群主时会临时显示全部，这里明说一句，免得误以为过滤坏了
  const wl = (sources||[]).filter(s=>s.wl_unresolved);
  $("statusLine").innerHTML = bad.length
    ? `<span class="err">${bad.length} 个来源异常</span>`
    : (wl.length
        ? `<span style="color:#f59e0b">${wl.map(s=>s.name).join("、")} 昵称待识别，暂显示全部</span>`
        : `<span style="color:#22c55e">全部来源正常</span>`);
  const dot = $("liveDot");
  if(dot) dot.style.background = (bad.length || wl.length) ? "#f59e0b" : "#22c55e";
}

async function load(){
  try{
    const r = await fetch("/api/feed?hours=" + currentHours, {cache:"no-store"});
    const d = await r.json();
    lastData = d;
    dataFresh = true;
    lastFullSync = Date.now();
    $("updated").textContent = d.updated || "--";
    updStatus(d.sources || []);
    renderChips(d.sources||[]);
    renderPosts();
    if(d.posts && d.posts.length){
      prevMaxTs = d.posts[0].ts;   // 已按时间倒序，首条即最新
    }
    saveCache(d);
  }catch(e){
    $("liveDot").style.background = "#ef4444";
    $("statusLine").innerHTML = `<span class="err">服务连接失败：${esc(String(e))}</span>`;
  }
}

// 首屏先用上次的数据垫一下：跨境到 Render 光握手就要一两秒，
// 有缓存的话打开瞬间就有内容，不用对着白屏等。数据到了自然覆盖。
function cacheKey(){ return "feed_cache_" + currentHours; }

function paintFromCache(){
  try{
    const c = JSON.parse(localStorage.getItem(cacheKey()) || "null");
    if(!c || !c.posts || !c.posts.length) return false;
    lastData = c;
    dataFresh = false;      // 缓存不是全量最新，别拿它当增量基准
    $("updated").textContent = (c.updated || "--") + "（缓存）";
    renderChips(c.sources||[]);
    renderPosts();
    return true;
  }catch(e){ return false; }
}

let lastCacheSig = "";
function saveCache(d){
  // 内容没变就别反复序列化 90KB，省主线程时间
  const sig = (d.posts&&d.posts.length ? d.posts[0].ts : 0) + "|" + (d.total||0) + "|" + currentHours;
  if(sig === lastCacheSig) return;
  lastCacheSig = sig;
  try{
    localStorage.setItem(cacheKey(), JSON.stringify({
      updated: d.updated, total: d.total, sources: d.sources, posts: d.posts
    }));
  }catch(e){}
}

// ===== 实时推送：任一源有新发言，服务端立刻通过 SSE 通知，不用等 5 秒轮询 =====
// 连上就停掉轮询；断线自动退回 5 秒轮询兜底（EventSource 自身会重连）。
let sseOk = false, streamVer = -1, loadTimer = null;
let dataFresh = false;        // lastData 是否为服务端最新全量（缓存垫底时是 false）
let lastFullSync = 0;         // 上次全量同步时刻，超时就不敢只信增量

function postKey(p){
  return (p.source||"") + "\u0001" + (p.speaker||"") + "\u0001" + (p.time||"") + "\u0001" + (p.text||"");
}

// 把 SSE 推来的新增帖子直接插进本地列表：省掉一次跨境拉取（1~2 秒）
function applyDelta(m){
  try{
    if(!lastData || !lastData.posts) return false;
    const cutoff = currentHours ? (Date.now()/1000 - currentHours*3600) : 0;
    const have = new Set(lastData.posts.map(postKey));
    const oldMax = lastData.posts.length ? lastData.posts[0].ts : null;
    let n = 0;
    for(const p of m.added){
      if(!p || typeof p.ts !== "number") continue;
      if(p.ts < cutoff) continue;                 // 不在当前时间窗口内的直接丢掉
      const k = postKey(p);
      if(have.has(k)) continue;
      have.add(k);
      lastData.posts.push(p);
      n++;
    }
    if(!n) return false;
    lastData.posts.sort((a,b)=> b.ts - a.ts);
    lastData.total = lastData.posts.length;
    if(m.updated) lastData.updated = m.updated;
    if(m.sources && m.sources.length){
      lastData.sources = m.sources;
      renderChips(m.sources);
      updStatus(m.sources);
    }
    prevMaxTs = oldMax;                            // 用旧基准判断谁是「新发言」以高亮
    $("updated").textContent = lastData.updated || "--";
    renderPosts();
    prevMaxTs = lastData.posts[0].ts;
    saveCache(lastData);
    return true;
  }catch(e){ return false; }
}

function scheduleLoad(delay){
  if(loadTimer) return;
  loadTimer = setTimeout(()=>{ loadTimer = null; if(!paused) load(); }, delay || 180);
}

function setStreamAlive(on){
  if(on === sseOk) return;
  sseOk = on;
  const dot = $("liveDot");
  if(dot) dot.title = on ? "实时推送已连接" : "实时推送断开，已退回轮询";
  if(on){
    clearInterval(window._loop);
    window._loop = null;
  }else{
    startTimers();          // 兜底轮询
  }
}

function startStream(){
  if(!window.EventSource) return;
  try{
    const es = new EventSource("/api/stream");
    es.addEventListener("open", ()=> setStreamAlive(true));
    es.addEventListener("tick", (e)=>{
      setStreamAlive(true);
      let m = null;
      try{ m = JSON.parse(e.data); }catch(_){ return; }
      if(streamVer === -1 || streamVer === m.ver){ streamVer = m.ver; return; }  // 首帧只记基线
      streamVer = m.ver;
      if(paused) return;   // 手动暂停时不改列表，但版本号照记，恢复后不会补一堆
      // 增量够小、数据是全量拿的、且最近同步过 -> 直接本地插入，不必再拉一次
      if(!m.full && dataFresh && m.added && m.added.length
         && (Date.now() - lastFullSync) < 30000 && applyDelta(m)){
        return;
      }
      if(!m.full && (!m.added || !m.added.length)){
        // 只是来源状态变了（没新帖），刷一下状态条就好，别为这点事跨境拉 19KB
        if(m.sources && m.sources.length && lastData){ lastData.sources = m.sources; renderChips(m.sources); updStatus(m.sources); }
        return;
      }
      scheduleLoad(120);
    });
    es.addEventListener("error", ()=>{ setStreamAlive(false); });
  }catch(e){ setStreamAlive(false); }
}

function loop(){
  if(!paused) load();
}

function startTimers(){
  clearInterval(cdTimer);
  cdLeft = REFRESH_MS/1000;
  cdTimer = setInterval(tick, 1000);
  clearInterval(window._loop);
  window._loop = setInterval(loop, REFRESH_MS);
}

$("refreshBtn").onclick = ()=>{ cdLeft = REFRESH_MS/1000; load(); };
$("win").onchange = (e)=>{ currentHours = parseInt(e.target.value,10) || 0; prevMaxTs = null; paintFromCache(); load(); };
$("pauseBtn").onclick = ()=>{
  paused = !paused;
  $("pauseBtn").textContent = paused ? "继续" : "暂停";
  $("pauseBtn").classList.toggle("primary", paused);
};
$("search").addEventListener("input", renderPosts);

const VIEWS = ['feed','sentiment','lianban'];
document.querySelectorAll('button.tab').forEach(b=>{
  b.onclick = ()=>{
    const v = b.dataset.view;
    document.querySelectorAll('button.tab').forEach(x=>x.classList.toggle('active', x===b));
    VIEWS.forEach(name=>{
      const el = document.getElementById('view-'+name);
      if(!el) return;
      el.style.display = (v===name) ? (name==='feed' ? '' : 'block') : 'none';
    });
    const nw = document.getElementById('newWin');
    if(nw){
      if(v==='feed'){ nw.style.display='none'; }
      else { nw.style.display=''; nw.href = '/' + v; }
    }
  };
});

loadVisible();          // 先读本地选择，首屏色标就是勾好的状态
ensureVisible();        // 没存过记录的，先按「一位都没勾」渲染，等他自己挑
paintFromCache();
load();
startTimers();
startStream();
</script>
</body>
</html>
