<script>
/* ============ 情绪阶段：仅保留仓位 / 风控提示 ============ */
const STAGE_MAP = {
  "冰点":  { advice:"情绪冰点，涨停稀少、亏钱效应强。原则空仓观望，等涨停数回升 + 指数转强的拐点确认再出手；若要试错，单票≤10%。", color:"#64748b", note:"试错仓 <10%" },
  "退潮":  { advice:"退潮期，高位分歧大、容易吃面。原则空仓，绝不接高位补跌标的。", color:"#475569", note:"空仓为主" },
  "回暖":  { advice:"情绪回暖，赚钱效应开始修复，可逐步把仓位加到 30-50%，优先前排辨识度高的标的。", color:"#2563eb", note:"主攻 30-50%" },
  "发酵":  { advice:"情绪发酵，赚钱效应打开，仓位可到 50-70%，主攻主线前排，但别在一致高潮时追高。", color:"#16a34a", note:"重仓 50-70%" },
  "高潮":  { advice:"情绪高潮，涨停极多、连板很高——这正是该减仓的时候。不追高、不接一字板，落袋为安。", color:"#e03b3b", note:"减仓不追高" },
  "震荡":  { advice:"混沌期，方向不明、题材轮动快。半仓以内快进快出，忌盘中追高打板。", color:"#e08a00", note:"半仓 20-40%" }
};

/* ============ 接口 ============ */
const TX = "https://qt.gtimg.cn/q=";
const EX_BASE = "https://push2ex.eastmoney.com/";
const EX_UT = "7eea3edcaed734bea9cbfc24409ed989";
const IDX_CODES = ["sh000001","sz399001","sz399006","sz399300"];

const EM = {
  concept: "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=60&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:3+f:!50&fields=f12,f14,f3,f104,f105,f128,f136,f6",
  consStocks: (bk) => `https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=60&po=1&np=1&fltt=2&invt=2&fid=f3&fs=b:${bk}+f:!50&fields=f12,f14,f3`,
  ztPool: (d) => `${EX_BASE}getTopicZTPool?ut=${EX_UT}&dpt=wz.ztzt&Pageindex=0&pagesize=300&sort=fbt%3Aasc&date=${d}`,
  dtPool: (d) => `${EX_BASE}getTopicDTPool?ut=${EX_UT}&dpt=wz.ztzt&Pageindex=0&pagesize=300&sort=fund%3Aasc&date=${d}`,
  zbPool: (d) => `${EX_BASE}getTopicZBPool?ut=${EX_UT}&dpt=wz.ztzt&Pageindex=0&pagesize=300&sort=fbt%3Aasc&date=${d}`
};

/* 伪板块：东财统计/持仓/指数成分类板块，不是真题材主线（保留专精特新、国企改革等真题材） */
const FAKE_BK = /昨日|连板_|涨停_|红利|破净|价值股|证金|汇金|社保|基金重仓|机构重仓|券商金股|养老金|保险重仓|信托重仓|QFII|融资融券|转融券|标准普尔|富时|MSCI|成分股|茅指数|宁组合|上证|深证|创业板|科创板|AH股|B股|ST股|低价股|高价股/;

/* 涨停池按所属行业聚合 → 板块热度榜（超短主线口径：涨停家数最多＝最强） */
function buildSectorBoard(pool) {
  const g = {};
  pool.forEach(x => {
    const k = x.hybk || "其他";
    if (!g[k]) g[k] = { name: k, stocks: [], ztCount: 0, maxLbc: 0 };
    const lbc = num(x.lbc) || 1;
    g[k].stocks.push({ code: String(x.c), name: x.n, lbc: lbc });
    g[k].ztCount++;
    g[k].maxLbc = Math.max(g[k].maxLbc, lbc);
  });
  return Object.values(g)
    .map(b => { b.stocks.sort((a, c) => c.lbc - a.lbc); return b; })
    .sort((a, b) => b.ztCount - a.ztCount || b.maxLbc - a.maxLbc)
    .slice(0, 8);
}

/* ---- 腾讯 JSONP：返回 v_<code>="..." 全局变量 ---- */
function tencent(codes, timeout = 13000) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, timeout);
    function cleanup() { clearTimeout(timer); if (s.parentNode) s.parentNode.removeChild(s); }
    s.onerror = () => { cleanup(); reject(new Error("neterr")); };
    s.onload = () => {
      try {
        const out = {};
        codes.forEach(c => { const v = window["v_" + c]; if (v) out[c] = String(v); });
        cleanup(); resolve(out);
      } catch (e) { cleanup(); reject(e); }
    };
    s.src = TX + codes.join(",");
    document.body.appendChild(s);
  });
}
/* ---- 东方财富 JSONP ---- */
let cbSeq = 0;
function emjsonp(url, timeout = 13000) {
  return new Promise((resolve, reject) => {
    const name = "emcb" + (cbSeq++);
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, timeout);
    function cleanup() { clearTimeout(timer); delete window[name]; if (s.parentNode) s.parentNode.removeChild(s); }
    window[name] = function (d) { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error("neterr")); };
    s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "cb=" + name;
    document.body.appendChild(s);
  });
}
async function emTry(url, timeout) {
  try { return await emjsonp(url, timeout); } catch (e) { return null; }
}

/* ============ 计算 ============ */
const IDX_NAMES = { sh000001: "上证指数", sz399001: "深证成指", sz399006: "创业板指", sz399300: "沪深300" };
function parseIdx(str, code) {
  const p = str.split("~");
  const ti = p.findIndex(x => /^\d{14}$/.test(x));
  const pct = ti >= 0 ? parseFloat(p[ti + 2]) : parseFloat(p[34] || "0");
  const amtRaw = ti >= 0 ? (p[ti + 5] || "").split("/")[2] : "0";
  return { name: IDX_NAMES[code] || p[1], price: parseFloat(p[3]) || 0, pct: isNaN(pct) ? 0 : pct, amountYi: parseFloat(amtRaw || "0") / 1e8, stamp: ti >= 0 ? p[ti] : "" };
}
function limitUp(code) {
  const c = String(code || "");
  if (/^(83|87|88|89|92|920|4)/.test(c)) return 30;
  if (/^(68|30|301|302)/.test(c)) return 20;
  return 10;
}
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

function classify(d) {
  const idxUp = d.idxPct >= 0;
  if (d.zt != null) {
    if (d.zt < 20) return (d.dt != null && d.dt >= 15) ? "退潮" : "冰点";
    if (d.dt != null && d.dt >= 15) return "退潮";
    if (d.dt != null && d.zt >= 20 && d.zt < 35 && ((d.lbcMax || 0) <= 2 || d.dt >= d.zt * 0.6)) return "退潮";
    if (d.zt >= 80 && (d.lbcMax || 0) >= 5) return "高潮";
    if (d.zt >= 55 && (d.dt == null || d.dt <= 8) && (d.lbcMax || 0) >= 3) return "发酵";
    if (d.zt >= 35 && (d.dt == null || d.dt <= 12)) return idxUp ? "回暖" : "退潮";
    return "震荡";
  }
  if (d.idxPct > 0.5) return "回暖";
  if (d.idxPct < -0.5) return "退潮";
  return "震荡";
}

/* ============ 渲染 ============ */
function marketStatus() {
  const n = new Date(); const day = n.getDay(); const h = n.getHours(); const m = n.getMinutes();
  const t = h * 60 + m;
  if (day === 0 || day === 6) return "休市（周末）";
  if ((t >= 9 * 60 + 15 && t <= 11 * 60 + 30) || (t >= 13 * 60 && t <= 15 * 60)) return "交易中";
  if (t >= 15 * 60) return "已收盘";
  if (t < 9 * 60 + 15) return "盘前";
  return "午间休市";
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function fmtPct(p) { return (p > 0 ? "+" : "") + Number(p).toFixed(2) + "%"; }

function renderBoard(boards, mode) {
  if (!boards || !boards.length) {
    return `<div class="note">该榜暂未取到数据（东方财富接口限流）。点「立即刷新」重试，其余功能不受影响。</div>`;
  }
  let h = "";
  boards.forEach((b, i) => {
    const rankCls = i === 0 ? "" : (i === 1 ? "r2" : (i === 2 ? "r3" : "rn"));
    const chips = b.stocks.length ? b.stocks.map(s => {
      const lb = s.lbc > 1 ? `<span class="lb">${s.lbc}板</span>` : `<span class="lb lb1">首板</span>`;
      return `<span class="chip">${esc(s.name)}<span class="code">${esc(s.code)}</span>${lb}</span>`;
    }).join("") : `<span class="empty">该板块无涨停个股</span>`;
    let stat = "";
    if (mode === "sector") {
      stat = `涨停 <b style="color:#e03b3b">${b.ztCount}</b> 只 ｜ 最高 ${b.maxLbc} 板`;
    } else {
      const pctCls = b.pct >= 0 ? "good" : "bad";
      stat = `<span class="pct ${pctCls}">${fmtPct(b.pct)}</span> ｜ 涨停 <b style="color:#e03b3b">${b.ztCount}</b> 只 ｜ 成交 ${b.amount.toFixed(0)}亿`;
    }
    const sub = mode === "sector"
      ? `涨停个股按连板数排序 · 共 ${b.stocks.length} 只涨停`
      : `板块领涨：${esc(b.leader || "—")}${b.leaderPct != null ? " " + fmtPct(b.leaderPct) : ""} · 涨${b.up}/跌${b.down}`;
    h += `<div class="bk">
      <div class="top">
        <span class="rank ${rankCls}">${i + 1}</span>
        <span class="name">${esc(b.name)}</span>
        <span class="stat">${stat}</span>
      </div>
      <div class="ztline">${chips}</div>
      <div class="leader">${sub}</div>
    </div>`;
  });
  return h;
}

function render(data) {
  const stage = classify(data);
  const sm = STAGE_MAP[stage];
  const mkt = marketStatus();

  const ztCls = data.zt != null ? (data.zt >= 50 ? "good" : (data.zt < 20 ? "bad" : "neutral")) : "neutral";
  const dtCls = data.dt != null ? (data.dt <= 5 ? "good" : (data.dt >= 15 ? "bad" : "warn")) : "neutral";
  const zbCls = data.zhabanRate != null ? (data.zhabanRate > 0.4 ? "bad" : (data.zhabanRate < 0.25 ? "good" : "warn")) : "neutral";
  const idxCls = (data.idxPct || 0) >= 0 ? "good" : "bad";
  const lbcTxt = data.lbcMax ? data.lbcMax + " 板" : "—";
  const zbTxt = data.zhabanRate != null ? (data.zhabanRate * 100).toFixed(1) + "%" : "—";

  const idxBox = ["sh000001","sz399001","sz399006","sz399300"].map(c => {
    const v = data.idx[c]; if (!v) return "";
    return `<div><b>${v.name}</b> <span class="${v.pct >= 0 ? "good" : "bad"}">${fmtPct(v.pct)}</span></div>`;
  }).join("");

  let html = "";
  if (data.emDegraded) {
    html += `<div class="note">提示：东方财富部分接口本次未取到，相关指标显示「—」并已降级为「指数强弱」判定。点「立即刷新」可重试。</div>`;
  }

  html += `<div class="verdict" style="background:${sm.color}">
    <div class="stage">${stage}</div>
    <div class="advice">${sm.advice}</div>
    <div class="tag">${mkt} ｜ ${sm.note} ｜ 数据 ${data.tradeDate || "最近交易日"} ｜ 更新 ${data.time}</div>
  </div>`;

  html += `<div class="grid">
    <div class="card"><div class="label">涨停家数</div><div class="val ${ztCls}">${data.zt != null ? data.zt : "—"}</div><div class="hint ${ztCls}">≥50 强势 / &lt;20 冰点</div></div>
    <div class="card"><div class="label">跌停家数</div><div class="val ${dtCls}">${data.dt != null ? data.dt : "—"}</div><div class="hint ${dtCls}">≤5 健康 / ≥15 危险</div></div>
    <div class="card"><div class="label">连板高度</div><div class="val neutral">${lbcTxt}</div><div class="hint neutral">最高连板（涨停池）</div></div>
    <div class="card"><div class="label">炸板率</div><div class="val ${zbCls}">${zbTxt}</div><div class="hint ${zbCls}">&lt;25% 好 / &gt;40% 差</div></div>
    <div class="card"><div class="label">指数强弱</div><div class="val ${idxCls}" style="font-size:15px;line-height:1.4">沪深300 ${fmtPct(data.idxPct || 0)}</div><div class="hint neutral">两市成交约 ${data.amount.toFixed(0)} 亿</div></div>
    <div class="card"><div class="label">主要指数</div><div class="idxbox" style="margin-top:2px">${idxBox}</div></div>
  </div>`;

  html += `<div class="sec-title">板块热度榜 · 涨停主线 <span class="pill">TOP ${data.sectors ? data.sectors.length : 0}</span><span class="desc">按板块内涨停家数排序 · 附全部涨停个股与连板数</span></div>`;
  html += renderBoard(data.sectors, "sector");

  html += `<div class="sec-title">概念题材热度榜 <span class="pill">TOP ${data.boards ? data.boards.length : 0}</span><span class="desc">取自概念涨幅榜前12个真题材，按板块内涨停家数重排 · 仅作题材视角补充，主线判断看上方主榜</span></div>`;
  html += renderBoard(data.boards, "concept");

  document.getElementById("content").innerHTML = html;
  document.getElementById("status").textContent = "已更新 " + data.time;
}

function showError(msg) {
  document.getElementById("content").innerHTML = `<div class="err">数据获取失败：${esc(msg)}<br>可能原因：1）网络不通；2）浏览器拦截跨域请求（换 Chrome 打开）；3）数据源临时限流（点「立即刷新」重试）。<br><br>手动判断法：同花顺「涨停板」专区看涨停/跌停/连板数，涨停≥50且跌停≤5＝环境好；涨停&lt;20或跌停≥15＝收手。</div>`;
}

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const i = idx++;
      try { out[i] = await fn(items[i], i); } catch (e) { out[i] = null; }
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return out;
}

/* ============ 主流程 ============ */
async function load() {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "加载中…";
  document.getElementById("status").textContent = "拉取中…";
  const txEl = document.getElementById("src-tx");
  const emEl = document.getElementById("src-em");
  const bkEl = document.getElementById("src-bk");
  try {
    /* 1) 腾讯主源：指数 + 成交额 + 最近交易日 */
    let raw;
    try { raw = await tencent(IDX_CODES); }
    catch (e) { throw new Error("腾讯主源网络错误：" + e.message); }
    const idx = {};
    let shPct = 0, amount = 0, stamp = "";
    IDX_CODES.forEach(c => {
      const v = parseIdx(raw[c] || "", c); idx[c] = v;
      if (c === "sh000001") { shPct = v.pct; stamp = v.stamp; }
      if (c === "sh000001" || c === "sz399001") amount += v.amountYi;
    });
    txEl.className = "src src-ok"; txEl.textContent = "腾讯财经：正常";
    const idxPct = idx["sz399300"] ? idx["sz399300"].pct : shPct;
    let tradeDate = stamp ? stamp.slice(0, 8) : "";
    if (!tradeDate) tradeDate = new Date().toISOString().slice(0, 10).replace(/-/g, "");
    const tradeDateShow = tradeDate.slice(0, 4) + "-" + tradeDate.slice(4, 6) + "-" + tradeDate.slice(6, 8);

    /* 2) 东方财富：涨停池 / 跌停池 / 炸板池（并行） */
    const [ztR, dtR, zbR] = await Promise.all([
      emTry(EM.ztPool(tradeDate)), emTry(EM.dtPool(tradeDate)), emTry(EM.zbPool(tradeDate))
    ]);

    let zt = null, dt = null, lbcMax = null, zhabanRate = null;
    const ztMap = {};
    if (ztR && ztR.rc === 0 && ztR.data) {
      const pool = ztR.data.pool || [];
      zt = ztR.data.tc != null ? ztR.data.tc : pool.length;
      lbcMax = pool.reduce((m, x) => Math.max(m, num(x.lbc) || 1), 0) || null;
      pool.forEach(x => { ztMap[String(x.c)] = { name: x.n, lbc: num(x.lbc) || 1, hybk: x.hybk || "—" }; });
    }
    const sectors = (ztR && ztR.rc === 0 && ztR.data && ztR.data.pool) ? buildSectorBoard(ztR.data.pool) : [];
    if (dtR && dtR.rc === 0 && dtR.data) dt = dtR.data.tc != null ? dtR.data.tc : (dtR.data.pool || []).length;
    if (zbR && zbR.rc === 0 && zbR.data) {
      const zbN = zbR.data.tc != null ? zbR.data.tc : (zbR.data.pool || []).length;
      if (zt != null && zt + zbN > 0) zhabanRate = zbN / (zt + zbN);
    }
    const emOK = zt != null;
    emEl.className = "src " + (emOK ? "src-ok" : "src-warn");
    emEl.textContent = emOK ? "东方财富：涨停池正常" : "东方财富：降级";

    /* 3) 板块热度榜 */
    let boards = [];
    const bkR = await emTry(EM.concept);
    if (bkR && bkR.rc === 0 && bkR.data && bkR.data.diff) {
      const candidates = bkR.data.diff.filter(x => x.f12 && x.f14 && !FAKE_BK.test(x.f14)).slice(0, 12);
      const results = await mapLimit(candidates, 4, async (x) => {
        const r = await emTry(EM.consStocks(x.f12), 9000);
        if (!r || r.rc !== 0 || !r.data || !r.data.diff) return null;
        const ztStocks = r.data.diff
          .filter(y => typeof y.f3 === "number" && num(y.f3) >= limitUp(y.f12) * 0.98)
          .map(y => {
            const info = ztMap[String(y.f12)];
            return { code: String(y.f12), name: y.f14, lbc: info ? info.lbc : 1 };
          })
          .sort((a, b) => b.lbc - a.lbc)
          .slice(0, 12);
        return {
          name: x.f14, pct: num(x.f3), up: num(x.f104), down: num(x.f105),
          amount: num(x.f6) / 1e8, leader: x.f128 || "—",
          leaderPct: x.f136 != null ? num(x.f136) : null,
          ztCount: ztStocks.length, stocks: ztStocks
        };
      });
      boards = results.filter(Boolean)
        .sort((a, b) => b.ztCount - a.ztCount || b.pct - a.pct)
        .slice(0, 8);
      bkEl.className = "src " + (boards.length ? "src-ok" : "src-warn");
      bkEl.textContent = boards.length ? "板块热度：正常（" + boards.length + "个）" : "板块热度：降级";
    } else {
      bkEl.className = "src src-warn"; bkEl.textContent = "板块热度：降级";
    }

    render({
      idx, idxPct, amount, tradeDate: tradeDateShow,
      zt, dt, lbcMax, zhabanRate, boards, sectors,
      emDegraded: !emOK,
      time: new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" })
    });
  } catch (e) {
    txEl.className = "src src-err"; txEl.textContent = "腾讯财经：失败";
    showError(e.message || "未知错误");
  } finally {
    btn.disabled = false; btn.textContent = "立即刷新";
  }
}

document.getElementById("refresh").addEventListener("click", load);
load();
setInterval(() => { if (marketStatus() === "交易中") load(); }, 40000);
</script>
